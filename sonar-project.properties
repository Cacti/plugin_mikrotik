# SonarCloud analysis settings for the MikroTik plugin.
#
# mikrotik.php and mikrotik_users.php are Cacti web UI entry points. Every
# view renders the same standard filter box (device/search/rows selectors) and
# sortable-table scaffolding, so the Copy/Paste Detector reports them as heavily
# duplicated by construction; this is inherent to Cacti's per-view page pattern
# rather than a defect. Exclude them from duplication detection only.
sonar.cpd.exclusions=mikrotik.php,mikrotik_users.php
